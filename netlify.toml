plugins = []

[functions]

  [functions."*"]

[build]
publish = "."
publishOrigin = "default"

  [build.environment]

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

[[headers]]
for = "/*"

  [headers.values]
  Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "DENY"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
  Strict-Transport-Security = "max-age=31536000"

[[headers]]
for = "/assets/images/*"

  [headers.values]
  Cache-Control = "public, max-age=604800"

[[headers]]
for = "/assets/video/*"

  [headers.values]
  Cache-Control = "public, max-age=604800"

[[headers]]
for = "/assets/fonts/*"

  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

